services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmanagement
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanagement"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-springboot
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskmanagement
      DB_USERNAME: taskuser
      DB_PASSWORD: taskpass
      # REQUIRED — export in your shell before `docker compose up`:
      #   export JWT_SECRET="$(openssl rand -base64 48)"
      # Compose aborts with this message if it is unset (no insecure fallback).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a long random secret}
      JWT_EXPIRATION_MS: "3600000"
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      # Origin used in scheduled-report share links.
      APP_PUBLIC_BASE_URL: http://localhost:8081
      # Optional: scheduled report emails are only sent when SMTP is configured.
      # SPRING_MAIL_HOST: smtp.example.com
      # SPRING_MAIL_PORT: "587"
      # SPRING_MAIL_USERNAME: apikey
      # SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      # SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      # SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
