<div class="logout">
  <div class="logout-card card">
    <h1 class="logout-title">Log out?</h1>
    <p class="logout-message">You'll need to sign in again to access your tasks.</p>
    <div class="logout-actions">
      <button class="btn btn-ghost" type="button" (click)="cancelLogout()">Cancel</button>
      <button class="btn danger" type="button" (click)="confirmLogout()">Log out</button>
    </div>
  </div>
</div>
