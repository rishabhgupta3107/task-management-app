<div class="logout-container">
  <div class="logout-card">
    <div class="logout-header">
      <h1 class="logout-title">Log out?</h1>
      <p class="logout-message">You'll need to sign in again to access your tasks.</p>
    </div>
    <div class="logout-actions">
      <button mat-button type="button" (click)="cancelLogout()" class="logout-button">Cancel</button>
      <button mat-raised-button color="warn" type="button" (click)="confirmLogout()"
              class="logout-button logout-confirm">Logout</button>
    </div>
  </div>
</div>
