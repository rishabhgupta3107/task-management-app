<div class="auth">
  <div class="auth-grid" aria-hidden="true"></div>
  <div class="auth-glow" aria-hidden="true"></div>

  <div class="auth-top">
    <a class="brand" routerLink="/welcome"><span class="brand-mark">◤</span> HELM</a>
    <app-theme-toggle></app-theme-toggle>
  </div>

  <div class="auth-card card wide">
    <span class="eyebrow mono">GET STARTED</span>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Spin up your own terminal in seconds.</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="reg-grid">
        <mat-form-field appearance="outline">
          <mat-label>Full name</mat-label>
          <input matInput formControlName="fullName" autocomplete="name">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" required>
          <mat-error *ngIf="registerForm.controls['username'].hasError('required')">Username is required.</mat-error>
          <mat-error *ngIf="registerForm.controls['username'].hasError('minlength') || registerForm.controls['username'].hasError('maxlength')">
            3–50 characters.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
          <mat-error *ngIf="registerForm.controls['email'].hasError('email')">Enter a valid email.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Date of birth</mat-label>
          <input matInput [matDatepicker]="dp" formControlName="dob">
          <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
          <mat-datepicker #dp></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="span-2">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" required>
          <mat-error *ngIf="registerForm.controls['password'].hasError('required')">Password is required.</mat-error>
          <mat-error *ngIf="registerForm.controls['password'].hasError('minlength')">At least 8 characters.</mat-error>
        </mat-form-field>
      </div>

      <p class="form-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="btn btn-primary auth-submit" type="submit" [disabled]="submitting">
        {{ submitting ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-alt">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
