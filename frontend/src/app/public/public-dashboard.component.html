<div class="public" *ngIf="data" [style.--brand]="data.brandColor || 'var(--accent)'">
  <header class="p-head">
    <div class="p-brand">
      <img *ngIf="data.logoUrl" [src]="data.logoUrl" [alt]="data.clientName + ' logo'" class="p-logo">
      <span *ngIf="!data.logoUrl" class="p-mark" [style.background]="data.brandColor || 'var(--accent)'">
        {{ data.clientName.charAt(0).toUpperCase() }}
      </span>
      <div>
        <h1>{{ data.dashboardName }}</h1>
        <p class="p-client">{{ data.clientName }}</p>
      </div>
    </div>
    <div class="p-head-right no-print">
      <span class="p-live mono"><span class="dot"></span>LIVE</span>
      <button class="btn" (click)="exportPdf()"><mat-icon>picture_as_pdf</mat-icon> PDF</button>
    </div>
  </header>

  <div class="p-widgets">
    <div class="w-slot" *ngFor="let w of data.widgets" [ngClass]="widgetClass(w)">
      <app-widget-card [widget]="w" [points]="data.metrics" [accent]="data.brandColor || ''" [readonly]="true"></app-widget-card>
    </div>
  </div>

  <footer class="p-foot mono">
    Powered by <span class="brand">◤ HELM</span>
  </footer>
</div>

<div class="p-msg" *ngIf="loading">Loading…</div>
<div class="p-msg" *ngIf="notFound">
  <mat-icon>link_off</mat-icon>
  <p>This dashboard link is not available.</p>
</div>
