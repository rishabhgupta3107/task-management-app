<h2 mat-dialog-title class="dialog-title">{{ data.title || 'Please confirm' }}</h2>
<mat-dialog-content class="dialog-content">
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions">
  <button class="btn btn-ghost" type="button" (click)="onNoClick()">Cancel</button>
  <button class="btn btn-primary" [mat-dialog-close]="true">Confirm</button>
</mat-dialog-actions>
