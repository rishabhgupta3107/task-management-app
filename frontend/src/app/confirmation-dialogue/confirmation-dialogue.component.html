<h2 mat-dialog-title class="dialog-title">{{ data.title || 'Please confirm' }}</h2>
<mat-dialog-content class="dialog-content">
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions">
  <button mat-button type="button" (click)="onNoClick()" class="dialog-button">Cancel</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="true" class="dialog-button submit-button">Confirm</button>
</mat-dialog-actions>
