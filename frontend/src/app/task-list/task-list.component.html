<div class="top-bar">
  <div class="left">
    <h1>Task list</h1>
  </div>
  <div class="right">
    <button mat-icon-button [matMenuTriggerFor]="settingsMenu" aria-label="Settings">
      <mat-icon>settings</mat-icon>
    </button>
    <mat-menu #settingsMenu="matMenu" xPosition="after" yPosition="below">
      <button mat-menu-item (click)="openLogoutDialog()">Logout</button>
    </mat-menu>
  </div>
</div>

<div class="filter">
  <mat-form-field appearance="outline" class="title-input">
    <mat-label>Filter</mat-label>
    <input matInput #filterInput (keyup)="applyFilter(filterInput.value)" placeholder="Search title or description">
  </mat-form-field>

  <button mat-raised-button color="primary" class="create-button" (click)="openTaskCreateDialog()">
    Create a Task
  </button>
</div>

<div class="task-table">
  <table mat-table [dataSource]="tasks" matSort (matSortChange)="onSort($event)" class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{ row.id }} </td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
      <td mat-cell *matCellDef="let row"> {{ row.title }} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
      <td mat-cell *matCellDef="let row"> {{ row.status }} </td>
    </ng-container>

    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Priority </th>
      <td mat-cell *matCellDef="let row"> {{ row.priority }} </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button (click)="viewTaskDetails(row)" aria-label="View task details">
          <mat-icon>info</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="confirmDeleteTask(row)" aria-label="Delete task">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <p class="empty-state" *ngIf="!loading && tasks.length === 0">No tasks found.</p>

  <mat-paginator
    [length]="totalElements"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPage($event)">
  </mat-paginator>
</div>
