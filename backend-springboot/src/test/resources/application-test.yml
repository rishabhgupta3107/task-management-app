spring:
  datasource:
    url: jdbc:h2:mem:taskmanagement;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Tests use Hibernate-generated schema, not the Postgres migrations.
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-that-is-long-enough-for-hs256-signing-0123456789
  expiration-ms: 3600000

app:
  cors:
    allowed-origins: http://localhost:4200
