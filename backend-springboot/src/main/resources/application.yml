spring:
  application:
    name: Task Management Application - Spring Boot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanagement}
    username: ${DB_USERNAME:taskuser}
    password: ${DB_PASSWORD:taskpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway owns the schema; Hibernate only validates that entities match it.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    baseline-on-migrate: true

# JWT configuration. The secret MUST be supplied via the JWT_SECRET environment
# variable in any real environment. The default below is for local development only
# and is intentionally long enough (>256 bits) for HS256.
jwt:
  secret: ${JWT_SECRET:local-development-only-secret-change-me-0123456789abcdef}
  # Access-token lifetime in milliseconds (default 1 hour).
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# CORS: comma-separated list of allowed origins.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Lock down actuator: only health and info are exposed, and details are hidden.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  error:
    # Don't leak internal messages/stack detail in production responses. The global
    # exception handler still returns intentional, sanitized messages and field errors.
    # Override to "always" locally for debugging: ERROR_INCLUDE_MESSAGE=always
    include-message: ${ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${ERROR_INCLUDE_BINDING_ERRORS:never}
    include-stacktrace: never
    include-exception: false
